<style>

om:27px;right:27px;font-size:9px;letter-spacing:2px;color:#647b70}footer{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-top:22px}.foot-title{font-size:12px;font-weight:600}.foot-sub{font-size:11px;color:#75827a;margin-top:5px}.tags{display:flex;gap:8px}.tags span{padding:7px 11px;border:1px solid #d5d9cc;border-radius:20px;font-size:9px;letter-spacing:1px}.wheel-back{transform-origin:398px 402px;animation:spin 1.6s linear infinite}.wheel-front{transform-origin:716px 402px;animation:spin 1.6s linear infinite}.crank{transform-origin:547px 404px;animation:spin 1.6s linear infinite}.rider{animation:bob 1.6s ease-in-out infinite}.scarf-tail{transform-origin:586px 216px;animation:flap .8s ease-in-out infinite alternate}.wing{transform-origin:535px 256px;animation:wing 1.6s ease-in-out infinite}.clouds{animation:clouds 48s linear infinite}.road-marks{animation:travel 2.8s linear infinite}.near-grass{animation:travel 5.6s linear infinite}.wind{animation:wind 2.4s ease-in-out infinite}.wind.delay{animation-delay:1.2s}.far-leg{animation:leg-far 1.6s linear infinite}.near-leg{animation:leg-near 1.6s linear infinite}.near-foot{animation:foot-near 1.6s linear infinite}.far-foot{animation:foot-far 1.6s linear infinite}.tail-feather{transform-origin:484px 286px;animation:flap .8s ease-in-out infinite alternate}.bird-far{animation:bird 4s ease-in-out infinite}.bird-far.second{animation-delay:-2s}

@keyframes leg-near{0%,100%{d:path('M 514 299 Q 499 345 549 365 L 578 404')}25%{d:path('M 514 299 Q 493 358 521 382 L 547 435')}50%{d:path('M 514 299 Q 470 344 487 367 L 516 404')}75%{d:path('M 514 299 Q 482 323 510 335 L 547 373')}}

@media(prefers-reduced-motion:reduce){.scene *{animation:none!important}.near-foot{transform:translate(578px,404px)}.far-foot{transform:translate(516px,404px)}}
@media(max-width:640px){body{padding:22px 5vw}.edition{font-size:8px;letter-spacing:1px}.brand{font-size:10px;letter-spacing:1px}.intro{display:block;padding-top:26px}.intro p{margin-top:14px;font-size:12px}h1{letter-spacing:-1px}.scene{width:160%;max-width:none;margin-left:-30%}.caption{top:16px;left:17px;font-size:8px}.scene-number{top:16px;right:17px}.corner{display:none}footer{align-items:flex-start}.tags{flex-wrap:wrap;justify-content:flex-end;max-width:140px}.tags span{font-size:8px}.controls{bottom:15px;left:16px}#pause{bottom:25px;left:29px}}
