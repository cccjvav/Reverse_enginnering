name: ShunCode 0.8.1 forensics and version diff

# The author shipped 0.8.1 and asked what changed. The sandbox cannot resolve
# Git LFS, so the installer can only be opened here, the same way 0.7.4 was.
#
# Deliberately a SEPARATE workflow rather than an edit to installer-forensics:
# that one produces the hash-verified 0.7.4 baseline the whole project rests
# on, and the comparison is only meaningful while that baseline stays
# untouched. Nothing here writes into recovered/shuncode-extension.

on:
  push:
    branches: ['arena/**']
    paths:
      - .github/workflows/version-diff-0-8-1.yml
      - tools/compare_versions.py
      - ShunCode-0.8.1-Windows-x64.exe
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shuncode-version-diff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diff:
    if: startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout this branch with the LFS installers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          lfs: true

      - name: Confirm the new installer is a real file, not an LFS pointer
        run: |
          size=$(stat -c%s ShunCode-0.8.1-Windows-x64.exe)
          echo "installer bytes: $size"
          # A pointer is ~134 bytes; refuse to continue on one, because every
          # later step would silently describe nothing.
          test "$size" -gt 1000000

      - name: Install static archive readers (not the application)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full cmake g++ make \
            libboost-date-time-dev zlib1g-dev libbz2-dev libboost-filesystem-dev \
            libboost-iostreams-dev libboost-system-dev libboost-program-options-dev liblzma-dev

      - name: Read pinned upstream extractor source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dscharrer/innoextract
          ref: 6e9e34ed0876014fdb46e684103ef8c3605e382e
          path: .work/innoextract-source
          persist-credentials: false

      - name: Build the static extractor, not the application
        id: build
        continue-on-error: true
        run: |
          python3 tools/build_extractor.py
          echo "$GITHUB_WORKSPACE/.work/innoextract-build" >> "$GITHUB_PATH"

      # continue-on-error so the identification report still reaches the branch
      # when extraction fails: the first attempt crashed before writing it and
      # left nothing to diagnose from, since Actions logs are not reachable
      # from the analysis sandbox.
      - name: Identify and statically extract 0.8.1
        id: extract
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python3 tools/installer_forensics.py \
            --package ShunCode-0.8.1-Windows-x64.exe \
            --extract-dir .work/extracted-0-8-1 \
            --output docs/evidence/installer-0-8-1.json \
            --require-extraction

      - name: Recover the 0.8.1 extension into its own tree
        id: recover
        if: steps.extract.outcome == 'success'
        continue-on-error: true
        run: |
          # Separate output directory: the 0.7.4 originals are protected and
          # their hashes are cited throughout the project.
          python3 tools/recover_custom_extension.py \
            --tree .work/extracted-0-8-1 \
            --output recovered/shuncode-0.8.1 \
            --report docs/evidence/custom-extension-0-8-1.json

      # compare_versions.py prints the headline numbers itself, so there is no
      # second step reformatting them - one source of truth for the summary.
      - name: Compare 0.8.1 against the recovered 0.7.4 baseline
        if: steps.recover.outcome == 'success'
        run: |
          python3 tools/compare_versions.py \
            --new-tree recovered/shuncode-0.8.1 \
            --baseline recovered/shuncode-extension \
            --output docs/evidence/version-diff-0-8-1.json

      - name: Recover how 0.8.1 adapts the clipboard, in case it moved again
        if: steps.extract.outcome == 'success'
        continue-on-error: true
        run: |
          python3 tools/probe_clipboard_adaptation.py \
            --tree .work/extracted-0-8-1 \
            --output docs/evidence/clipboard-adaptation-0-8-1.json

      # Split into one step per operation on purpose. Actions log bodies are
      # not reachable from the analysis sandbox, but per-step conclusions are
      # available over the API, so narrow steps are the diagnosis channel.
      - name: Report what the extraction produced
        if: always()
        run: |
          echo "--- evidence files ---"
          ls -l docs/evidence/*0-8-1* 2>/dev/null || echo "none"
          echo "--- recovered tree ---"
          if test -d recovered/shuncode-0.8.1; then
            find recovered/shuncode-0.8.1 -type f | wc -l
            du -sh recovered/shuncode-0.8.1
          else
            echo "absent"
          fi

      - name: Check every evidence file stays within the size bound
        if: always()
        run: |
          for f in docs/evidence/installer-0-8-1.json \
                   docs/evidence/custom-extension-0-8-1.json \
                   docs/evidence/version-diff-0-8-1.json \
                   docs/evidence/clipboard-adaptation-0-8-1.json; do
            if test -f "$f"; then
              size=$(stat -c%s "$f")
              echo "$size $f"
              test "$size" -lt 4000000
            fi
          done

      - name: Show what else the run left modified
        if: always()
        run: |
          # build_extractor.py rewrites a tracked evidence file. Unstaged
          # tracked changes make git rebase refuse outright, which is what
          # sank the previous attempt five times in a row.
          git status --porcelain

      # Two commits on purpose. The diff is the actual answer to "what
      # changed" and is a few kilobytes; the recovered tree is bulk. Pushing
      # the small one first means a problem with the bulk cannot cost the
      # result of a 3-minute extraction.
      - name: Commit and push the evidence first
        id: push_evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in docs/evidence/installer-0-8-1.json \
                   docs/evidence/custom-extension-0-8-1.json \
                   docs/evidence/version-diff-0-8-1.json \
                   docs/evidence/clipboard-adaptation-0-8-1.json \
                   docs/evidence/extractor-build.json; do
            test -f "$f" && git add -- "$f"
          done
          if git diff --cached --name-only | grep -q '^recovered/shuncode-extension/'; then
            echo "this run modified the protected 0.7.4 tree"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "no evidence to commit"
            exit 0
          fi
          git commit -m "Record ShunCode 0.8.1 identification and the diff against 0.7.4"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF}" || { sleep 5; continue; }
            # --autostash: sibling workflows leave tracked evidence files
            # dirty, and without it rebase aborts before trying anything.
            git rebase --autostash FETCH_HEAD || { git rebase --abort || true; sleep 5; continue; }
            git push origin "HEAD:${GITHUB_REF}" && exit 0
            sleep 5
          done
          echo "could not push the evidence after 5 attempts"
          exit 1

      - name: Commit and push the recovered 0.8.1 sources
        if: always()
        run: |
          test -d recovered/shuncode-0.8.1 || { echo "nothing recovered"; exit 0; }
          git add -- recovered/shuncode-0.8.1
          if git diff --cached --quiet; then
            echo "no sources to commit"
            exit 0
          fi
          echo "staging $(git diff --cached --name-only | wc -l) files"
          git commit -m "Recover the ShunCode 0.8.1 extension sources"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF}" || { sleep 5; continue; }
            git rebase --autostash FETCH_HEAD || { git rebase --abort || true; sleep 5; continue; }
            git push origin "HEAD:${GITHUB_REF}" && exit 0
            sleep 5
          done
          echo "could not push the sources after 5 attempts"
          exit 1

      - name: Propagate failure after the diagnostics are safely on the branch
        if: steps.build.outcome != 'success' || steps.extract.outcome != 'success' || steps.recover.outcome != 'success'
        run: |
          echo "build=${{ steps.build.outcome }}"
          echo "extract=${{ steps.extract.outcome }}"
          echo "recover=${{ steps.recover.outcome }}"
          exit 1
