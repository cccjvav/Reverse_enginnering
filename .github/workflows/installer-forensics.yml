name: Windows installer forensics

on:
  push:
    # Session branches rotate; match the family, not one hardcoded id.
    branches: ['arena/**']
    paths:
      - .github/workflows/installer-forensics.yml
      - tools/installer_forensics.py
      - tools/build_extractor.py
      - tools/recover_custom_extension.py
      - tools/capture_bridge_ui.mjs
      - tools/probe_clipboard_adaptation.py
      - tools/build_community.mjs
      - tools/patch_bridge_ui.mjs
      - tools/patch_utils.mjs
      - tools/apply_community.py
      - tools/validate_community.py
      - community/extension/src/**
      - community/ui/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Scope per branch: evidence is committed back to the triggering ref, so
  # two session branches must not serialise behind one global group.
  group: windows-installer-forensics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    if: startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout this branch with the original LFS sample
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          lfs: true
      - name: Install static archive readers (not the application)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends p7zip-full cmake g++ make libboost-date-time-dev zlib1g-dev libbz2-dev libboost-filesystem-dev libboost-iostreams-dev libboost-system-dev libboost-program-options-dev liblzma-dev
      - name: Read pinned upstream extractor source (supports Inno 6.4.0.1)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dscharrer/innoextract
          ref: 6e9e34ed0876014fdb46e684103ef8c3605e382e
          path: .work/innoextract-source
          persist-credentials: false
      - name: Build the static extractor, not the application
        id: build
        continue-on-error: true
        run: |
          python3 tools/build_extractor.py
          echo "$GITHUB_WORKSPACE/.work/innoextract-build" >> "$GITHUB_PATH"
      - name: Identify the format and attempt static extraction
        if: steps.build.outcome == 'success'
        run: |
          python3 tools/installer_forensics.py \
            --package ShunCode-0.7.4-win32-x64-Setup.exe \
            --extract-dir .work/windows-extracted \
            --output docs/evidence/windows-extraction.json
          python3 tools/recover_custom_extension.py \
            --tree .work/windows-extracted \
            --output recovered/shuncode-extension \
            --report docs/evidence/custom-extension.json
      - name: Capture only the custom Bridge UI from the shipped host
        if: steps.build.outcome == 'success'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --max-old-space-size=6144 tools/capture_bridge_ui.mjs .work/windows-extracted
          node --max-old-space-size=6144 tools/capture_bridge_ui.mjs .work/windows-extracted sessions
      - name: Recover how the author adapted to Electron 44's clipboard rewrite
        if: steps.build.outcome == 'success'
        run: |
          python3 tools/probe_clipboard_adaptation.py \
            --tree .work/windows-extracted \
            --output docs/evidence/clipboard-adaptation.json
      - name: Test community policy and validate patch against both real host bundles
        if: steps.build.outcome == 'success'
        id: community
        continue-on-error: true
        run: |
          npm test
          python3 -m unittest discover -s tests -q
          npm run build:community
          python3 tools/validate_community.py --tree .work/windows-extracted
      - name: Save bounded report on this branch, not extracted binaries
        run: |
          test $(stat -c%s docs/evidence/extractor-build.json) -lt 100000
          if test -f docs/evidence/windows-extraction.json; then
            test $(stat -c%s docs/evidence/windows-extraction.json) -lt 4000000
            git add -- docs/evidence/windows-extraction.json
          fi
          if test -f docs/evidence/custom-extension.json; then
            git add -- docs/evidence/custom-extension.json
            git add -f -- recovered/shuncode-extension
          fi
          if test -f docs/evidence/bridge-ui.json; then
            git add -- docs/evidence/bridge-ui.json docs/evidence/bridge-ui-sessions.json recovered/bridge-ui recovered/bridge-ui-sessions
          fi
          if test -f docs/evidence/community-validation.json; then
            git add -- docs/evidence/community-validation.json
          fi
          if test -f docs/evidence/clipboard-adaptation.json; then
            test $(stat -c%s docs/evidence/clipboard-adaptation.json) -lt 2000000
            git add -- docs/evidence/clipboard-adaptation.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/evidence/extractor-build.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record installer identification and static extraction evidence"
          git push origin HEAD:${{ github.ref }}
      - name: Propagate extractor build failure after saving diagnostics
        if: steps.build.outcome != 'success' || steps.community.outcome != 'success'
        run: exit 1
