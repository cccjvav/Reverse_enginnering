name: Reconstructed Bridge core tests

on:
  push:
    branches: [arena/01a09d2c-reverse-enginnering-of-shun]
    paths:
      - .github/workflows/bridge-core-tests.yml
      - .gitattributes
      - package.json
      - package-lock.json
      - environment-cmd.yml
      - tools/check_cmd_environment.py
      - tools/run-learning.cmd
      - tools/apply-community.cmd
      - tools/package_community.py
      - tests/test_cmd_environment.py
      - community/README.md
      - tools/build_learning.mjs
      - tools/learning_lab.mjs
      - tools/learning_ui_lab.mjs
      - tools/patch_bridge_ui.mjs
      - community/ui/**
      - docs/learning/**
      - tools/audit_custom_boundary.mjs
      - tools/audit_extension_runtime.mjs
      - tools/build_linked_extension.mjs
      - tools/diagnose_linked_types.mjs
      - tools/check_release_readiness.mjs
      - reference/vscode-types/**
      - tools/reconstruct_bridge_core.mjs
      - tools/patch_utils.mjs
      - reconstructed/bridge-core/**
      - reconstructed/type-contracts/**
      - docs/evidence/contract-type-diagnostics.json
      - community/bridge-core/**
      - tests/helpers/**
      - tests/bridge-core-*.test.mjs
      - tests/community-*.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    if: github.ref == 'refs/heads/arena/01a09d2c-reverse-enginnering-of-shun'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout text evidence, without fetching or running the installer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install only the analysis/test tool dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify deterministic reconstruction and provenance
        run: npm run check:bridge-core
      - name: Run Node tests, not the full extension or Electron application
        run: npm test
      - name: Regression-test Python recovery and overlay tools on Linux
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tests -q

  windows-cmd-conda:
    if: github.ref == 'refs/heads/arena/01a09d2c-reverse-enginnering-of-shun'
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd /C CALL {0}
    steps:
      - name: Checkout text evidence only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: false
          persist-credentials: false
      - name: Create the declared conda environment using Miniforge
        uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167
        with:
          miniforge-version: latest
          activate-environment: shuncode-recovery
          environment-file: environment-cmd.yml
          auto-activate-base: false
      - name: Run real CMD and conda checks, not an application GUI
        run: |
          call "%CONDA%\condabin\conda.bat" activate shuncode-recovery
          if errorlevel 1 exit /b 1
          python tools\check_cmd_environment.py
          if errorlevel 1 exit /b 1
          call npm.cmd ci --ignore-scripts --no-audit --no-fund
          if errorlevel 1 exit /b 1
          call tools\run-learning.cmd
          if errorlevel 1 exit /b 1
          call tools\apply-community.cmd --help
          if errorlevel 1 exit /b 1
