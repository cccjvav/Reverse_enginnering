name: Windows package static probe

on:
  push:
    # Session branches rotate; match the family, not one hardcoded id.
    branches:
      - 'arena/**'
    paths:
      - .github/workflows/windows-static-probe.yml
      - tools/ci_windows_probe.py
      - ShunCode-0.7.4-win32-x64-Setup.exe
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Scope per branch: this job commits back to the triggering ref.
  group: windows-static-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    if: startsWith(github.ref, 'refs/heads/arena/')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Read this branch and its LFS package
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref }}
          lfs: true
      - name: Verify package and list archive without running it
        shell: pwsh
        run: |
          python tools/ci_windows_probe.py --package ShunCode-0.7.4-win32-x64-Setup.exe --output docs/evidence/windows-package.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save small report to the same branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/evidence/windows-package.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Record static Windows installer probe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:${{ github.ref }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
